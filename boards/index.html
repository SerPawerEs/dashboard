        .orb:nth-child(2) { width: 400px; height: 400px; background: radial-gradient(circle, #ec4899, #f43f5e); top: 50%; right: -5%; animation-duration: 20s; animation-delay: -5s; }
        .orb:nth-child(3) { width: 350px; height: 350px; background: radial-gradient(circle, #06b6d4, #3b82f6); bottom: -10%; left: 30%; animation-duration: 22s; animation-delay: -10s; }
        .orb:nth-child(4) { width: 300px; height: 300px; background: radial-gradient(circle, #10b981, #14b8a6); top: 20%; left: 50%; animation-duration: 18s; animation-delay: -3s; }

        #whiteboard { cursor: crosshair; display: block; position: absolute; top: 0; left: 0; z-index: 1; width: 1600px; height: 900px; touch-action: none; }
        #previewCanvas { position: absolute; top: 0; left: 0; z-index: 2; width: 1600px; height: 900px; pointer-events: none; }

        .tab-label { font-size: 10px; color: #ffffff66; margin: 0 4px; white-space: nowrap; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .tab-btn { min-width: 100px; max-width: 150px; height: 40px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #ffffffaa; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; font-size: 12px; font-weight: 500; font-family: 'Inter', sans-serif; transition: all 0.2s; white-space: nowrap; position: relative; }

        .modal-btn.danger:hover { background: rgba(239, 68, 68, 0.55); }
        .modal-btn.primary { background: rgba(99, 102, 241, 0.35); border-color: rgba(99, 102, 241, 0.5); }
        .modal-btn.primary:hover { background: rgba(99, 102, 241, 0.55); }

        .notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px); padding: 10px 20px; background: rgba(16, 185, 129, 0.3); backdrop-filter: blur(20px); border: 1px solid rgba(16, 185, 129, 0.5); color: #fff; border-radius: 12px; font-size: 13px; z-index: 6000; opacity: 0; transition: all 0.3s ease; pointer-events: none; }
        .notification.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .notification.error { background: rgba(239, 68, 68, 0.3); border-color: rgba(239, 68, 68, 0.5); }
        #fileInput { display: none; }

            .tool-btn { width: 38px; height: 38px; } .tool-separator { height: 24px; } .preset-colors { display: none; }
            .size-control { display: flex; order: 99; flex: 1 0 100%; justify-content: center; margin: 4px 0 0; padding: 4px 10px 2px; gap: 10px; }

</head>

            if (currentStroke) currentStroke.points.push({x: pos.x, y: pos.y});
            if (state.currentTool === 'draw') { ctx.strokeStyle=state.currentColor; ctx.lineWidth=state.brushSize; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineTo(pos.x, pos.y); ctx.stroke(); }
            else if (state.currentTool === 'eraser') { ctx.globalCompositeOperation='destination-out'; ctx.lineWidth=state.brushSize*3; ctx.lineCap='round'; ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.globalCompositeOperation='source-over'; }
            else if (['line','rect','circle','triangle','arrow'].includes(state.currentTool)) drawShapePreview(pos.x, pos.y);
            state.lastX = pos.x; state.lastY = pos.y;
        }

        function endCanvasInteraction(e) {
            if (canvas.releasePointerCapture && e.pointerId !== undefined) {
                try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
            }
            activePointers.delete(e.pointerId ?? 'mouse');
            if (pinchGesture) {
                if (e.cancelable) e.preventDefault();
                if (activePointers.size < 2) {
                    pinchGesture = null;
                    state.activePointerId = null;
                    updateCursorStyle();
                } else {
                    beginPinchGesture();
                }
                return;
            }
            if (state.activePointerId !== null && e.pointerId !== undefined && e.pointerId !== state.activePointerId) return;
            if (e.cancelable) e.preventDefault();
            state.activePointerId = null;
            if (state.isPanning) { state.isPanning=false; updateCursorStyle(); return; }
            if (state.isDragging || state.isResizing) { state.isDragging=false; state.isResizing=false; saveState(); return; }
            if (!state.isDrawing) { currentStroke = null; clearShapePreview(); return; }
            state.isDrawing = false;
            const pos = getMousePos(e);
            if (currentStroke && currentStroke.points.length > 1) { addObject(currentStroke); currentStroke = null; }
            else if (['line','rect','circle','triangle','arrow'].includes(state.currentTool)) { addObject({ type: state.currentTool, x: state.startX, y: state.startY, width: pos.x-state.startX, height: pos.y-state.startY, color: state.currentColor, size: state.brushSize, fill: false }); }
            clearShapePreview(); ctx.beginPath();
        }

        canvas.addEventListener('pointerdown', beginCanvasInteraction);
        canvas.addEventListener('pointermove', moveCanvasInteraction);
        canvas.addEventListener('pointerup', endCanvasInteraction);
        canvas.addEventListener('pointercancel', endCanvasInteraction);
        canvas.addEventListener('pointerleave', (e) => { if (state.activePointerId === null) brushPreview.style.display='none'; });

        function addObject(obj) { const board = state.boards.find(b => b.id === state.activeBoardId); if(!board)return; board.objects.push(obj); renderBoard(state.activeBoardId); saveState(); }
        function updateCursorStyle() { canvas.style.cursor = state.spacePressed ? 'grab' : state.currentTool==='text'?'text':state.currentTool==='select'?'default':'crosshair'; }

        // ===== TEXTO =====
        let textFinishCallback = null;
        function registerTextFinish(callback) {
            if (textFinishCallback) textInput.removeEventListener('blur', textFinishCallback);
            textFinishCallback = () => {
                const activeCallback = textFinishCallback;
                if (activeCallback) textInput.removeEventListener('blur', activeCallback);
                textFinishCallback = null;
                callback();
            };
            textInput.addEventListener('blur', textFinishCallback);
        }

        function getTextMetrics(text, size) {
            const lines = (text || '').split('\n');
            ctx.save();
            ctx.font = `${size}px Inter, sans-serif`;
            const width = Math.max(40, ...lines.map(line => ctx.measureText(line || ' ').width));
            ctx.restore();
            return { width, height: Math.max(size * 1.4, lines.length * size * 1.2) };
        }

        function placeTextOverlay(clientX, clientY, width, height) {
            const maxLeft = window.innerWidth - Math.min(width || 260, window.innerWidth - 24) - 12;
            const maxTop = window.innerHeight - Math.min(height || 80, window.innerHeight - 24) - 12;
            textOverlay.style.left = `${Math.max(12, Math.min(clientX, maxLeft))}px`;
            textOverlay.style.top = `${Math.max(12, Math.min(clientY, maxTop))}px`;
        }

        function autosizeTextInput() {
            textInput.style.height = 'auto';
            textInput.style.height = `${Math.min(Math.max(52, textInput.scrollHeight + 4), Math.floor(window.innerHeight * 0.45))}px`;
        }

        function openTextEditor({ obj = null, clientX, clientY }) {
            const isEdit = !!obj;
            const size = Math.max(12, Math.min(isEdit ? (obj.size || 20) : state.brushSize * 3 + 10, 48));
            const startText = isEdit ? obj.text : '';
            const clientPos = isEdit ? boardToClient(obj.x, obj.y) : { x: clientX, y: clientY };
            const width = isEdit ? Math.min(Math.max(220, (obj.width || 180) + 44), Math.min(560, window.innerWidth - 24)) : Math.min(320, window.innerWidth - 24);

            textOverlay.style.display = 'block';
            placeTextOverlay(clientPos.x, clientPos.y, width, isEdit ? (obj.height || 60) + 34 : 80);
            textInput.value = startText;
            textInput.style.color = isEdit ? (obj.color || state.currentColor) : state.currentColor;
            textInput.style.fontSize = `${size}px`;
            textInput.style.width = `${width}px`;
            autosizeTextInput();

            let cancelled = false;
            textInput.oninput = autosizeTextInput;
            textInput.onkeydown = (e) => {
                if ((e.key === 'Enter' && !e.shiftKey) || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); textInput.blur(); }
                if (e.key === 'Escape') { cancelled = true; textInput.blur(); }
                e.stopPropagation();
            };
            textInput.onmousedown = (e) => e.stopPropagation();
            textInput.onpointerdown = (e) => e.stopPropagation();

            registerTextFinish(() => {
                const value = cancelled ? startText : textInput.value.trim();
                textOverlay.style.display = 'none';
                textInput.oninput = null;
                if (cancelled) return;

                if (isEdit) {
                    if (!value) { deleteSelectedObject(); return; }
                    if (value !== obj.text) {
                        obj.text = value; obj.size = size;
                        const metrics = getTextMetrics(value, size);
                        obj.width = metrics.width; obj.height = metrics.height;
                        renderBoard(state.activeBoardId); saveState();
                    }
                    return;
                }

                if (value) {
                    const rect = drawingArea.getBoundingClientRect();
                    const x = (clientX - rect.left) / state.zoom, y = (clientY - rect.top) / state.zoom;
                    const metrics = getTextMetrics(value, size);
                    addObject({ type:'text', x, y, width: metrics.width, height: metrics.height, text: value, color: state.currentColor, size });
                }
            });
            setTimeout(() => { textInput.focus(); if (isEdit) textInput.select(); }, 20);
        }

        function showTextInput(cx, cy) { openTextEditor({ clientX: cx, clientY: cy }); }
        function editSelectedText() { const obj = state.selectedObject; if (obj?.type === 'text') openTextEditor({ obj }); }

        function updateBrushPreview(e) {
            if (['draw','eraser'].includes(state.currentTool) && !state.isPanning && !state.isDrawing && !state.isDragging) {
                brushPreview.style.display='block'; brushPreview.style.left=`${e.clientX}px`; brushPreview.style.top=`${e.clientY}px`;
                const s = state.currentTool==='eraser'?state.brushSize*3:state.brushSize; brushPreview.style.width=`${s*state.zoom}px`; brushPreview.style.height=`${s*state.zoom}px`;
                brushPreview.style.borderColor = state.currentTool==='eraser'?'#ff4444':state.currentColor; brushPreview.style.background = state.currentTool==='eraser'?'rgba(255,68,68,0.2)':'rgba(255,255,255,0.1)';
            } else brushPreview.style.display='none';
        }

        function drawShapePreview(ex, ey) {
            previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height); previewCtx.beginPath(); previewCtx.strokeStyle=state.currentColor; previewCtx.lineWidth=state.brushSize; previewCtx.lineCap='round'; previewCtx.setLineDash([5,5]); previewCtx.globalAlpha=0.6;
            if(state.currentTool==='line'){previewCtx.moveTo(state.startX,state.startY);previewCtx.lineTo(ex,ey);previewCtx.stroke();}
            else if(state.currentTool==='rect'){previewCtx.strokeRect(state.startX,state.startY,ex-state.startX,ey-state.startY);}
            else if(state.currentTool==='circle'){const cx=state.startX+(ex-state.startX)/2,cy=state.startY+(ey-state.startY)/2,rx=Math.abs(ex-state.startX)/2,ry=Math.abs(ey-state.startY)/2;previewCtx.beginPath();previewCtx.ellipse(cx,cy,rx,ry,0,0,2*Math.PI);previewCtx.stroke();}
            else if(state.currentTool==='triangle'){previewCtx.beginPath();previewCtx.moveTo(state.startX+(ex-state.startX)/2,state.startY);previewCtx.lineTo(ex,ey);previewCtx.lineTo(state.startX,ey);previewCtx.closePath();previewCtx.stroke();}
            else if(state.currentTool==='arrow'){previewCtx.beginPath();previewCtx.moveTo(state.startX,state.startY);previewCtx.lineTo(ex,ey);previewCtx.stroke();}
            previewCtx.setLineDash([]); previewCtx.globalAlpha=1;
        }
        function clearShapePreview() { previewCtx.clearRect(0,0,previewCanvas.width,previewCanvas.height); }

        // UI
        colorPicker.addEventListener('input', e => { state.currentColor=e.target.value; colorPreview.style.background=e.target.value; document.querySelectorAll('.preset-color').forEach(p=>p.classList.remove('active')); });
        document.querySelectorAll('.preset-color').forEach(el => { el.addEventListener('click', () => { state.currentColor=el.dataset.color; colorPreview.style.background=el.dataset.color; colorPicker.value=el.dataset.color; document.querySelectorAll('.preset-color').forEach(p=>p.classList.remove('active')); el.classList.add('active'); }); });
        sizeSlider.addEventListener('input', e => { state.brushSize = parseInt(e.target.value); });
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => { btn.addEventListener('click', () => { state.currentTool=btn.dataset.tool; state.selectedObject=null; document.querySelectorAll('.tool-btn[data-tool]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); updateCursorStyle(); renderBoard(state.activeBoardId); }); });

        document.getElementById('btnUndo').addEventListener('click', undo);
        document.getElementById('btnRedo').addEventListener('click', redo);
        document.getElementById('btnClear').addEventListener('click', () => {
            if (state.selectedObject) { showModal('Eliminar elemento', '¿Eliminar el elemento seleccionado?', 'danger', deleteSelectedObject); return; }
            showModal('Limpiar tablero', '¿Estás seguro?', 'danger', () => { const board=state.boards.find(b=>b.id===state.activeBoardId); if(board){board.objects=[];board.imageData=null;ctx.clearRect(0,0,canvas.width,canvas.height);saveState();showNotification('Tablero limpiado');} });
        });
        document.getElementById('btnImport').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => { const file=e.target.files[0]; if(!file)return; const reader=new FileReader(); reader.onload=ev=>{const img=new Image();img.onload=()=>{const pos=getMousePos({clientX:window.innerWidth/2,clientY:window.innerHeight/2});let w=img.width,h=img.height;if(w>500||h>500){const r=Math.min(500/w,500/h);w*=r;h*=r;}addObject({type:'image',x:pos.x-w/2,y:pos.y-h/2,width:w,height:h,src:ev.target.result});showNotification('Imagen importada');};img.src=ev.target.result;};reader.readAsDataURL(file);fileInput.value=''; });
        document.getElementById('btnExport').addEventListener('click', () => { const l=document.createElement('a');l.download=`${state.boards.find(b=>b.id===state.activeBoardId)?.name||'tablero'}_${Date.now()}.png`;l.href=canvas.toDataURL('image/png');l.click();showNotification('Exportado'); });
        document.getElementById('btnZoomIn').addEventListener('click', () => { state.hasCustomView=true; state.zoom=Math.min(state.zoom+0.1,3);updateTransform(); });
        document.getElementById('btnZoomOut').addEventListener('click', () => { state.hasCustomView=true; state.zoom=Math.max(state.zoom-0.1,0.25);updateTransform(); });
        drawingArea.addEventListener('wheel', e => {
            e.preventDefault();
            state.hasCustomView=true;
            const before = getMousePos(e);
            const oldZoom = state.zoom;
            state.zoom = e.deltaY < 0 ? Math.min(oldZoom + 0.05, 3) : Math.max(oldZoom - 0.05, 0.25);
            const after = getMousePos(e);
            state.panX += (after.x - before.x) * state.zoom;
            state.panY += (after.y - before.y) * state.zoom;
            updateTransform();
        }, {passive:false});

        // ===== FIREBASE: ARQUITECTURA SEPARADA =====

        function unsubscribeActiveBoard() {
            if (activeBoardUnsub) { try { activeBoardUnsub(); } catch(e){} activeBoardUnsub = null; }
        }

        function subscribeActiveBoard(board) {
            unsubscribeActiveBoard();
            if (!board || !board.isCloud || !board.cloudId || !db) return;

            activeBoardUnsub = db.collection('boards').doc(board.cloudId).onSnapshot((doc) => {
                // Si el documento fue eliminado, mostrar error y recargar
                if (!doc.exists) {
                    showNotification('El tablero fue eliminado en otro dispositivo', 'error');
                    setTimeout(() => location.reload(), 1500);
                    return;
                }
                if (localUpdates[board.cloudId]) return;

                const data = doc.data();
                const localBoard = state.boards.find(b => b.id === board.id);
                if (!localBoard) {
                    // Tablero no existe localmente, ignorar o recargar
                    console.warn('Snapshot de tablero inexistente localmente');
                    return;
                }

                const cloudObjs = JSON.stringify(data.objects || []);
                const localObjs = JSON.stringify(localBoard.objects || []);
                if (cloudObjs === localObjs && data.imageData === localBoard.imageData && data.name === localBoard.name) return;

                localBoard.objects = data.objects || [];
                localBoard.imageData = Object.prototype.hasOwnProperty.call(data, 'imageData') ? data.imageData : localBoard.imageData;
                localBoard.name = data.name || localBoard.name;
                normalizeBoard(localBoard);

                const tabName = document.querySelector(`.tab-btn[data-board-id="${board.id}"] .tab-name`);
                if (tabName) tabName.textContent = localBoard.name;

                renderBoard(localBoard.id);
            });
        }

        function scheduleCloudSave() {
            const board = state.boards.find(b => b.id === state.activeBoardId);
            if (!board || !board.isCloud || !board.cloudId || !db) return;
            clearTimeout(cloudSaveTimeout);
            localUpdates[board.cloudId] = true;
            cloudSaveTimeout = setTimeout(() => {
                delete localUpdates[board.cloudId];
                saveBoardToCloud(board.id);
            }, 800);
        }

        async function saveBoardToCloud(boardId) {
            const board = state.boards.find(b => b.id === boardId);
            if (!board || !board.isCloud || !board.cloudId || !db) return;
            normalizeBoard(board);
            try {
                await db.collection('boards').doc(board.cloudId).set({
                    name: board.name, updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    imageData: board.imageData || null, objects: board.objects || [],
                    zoom: firebase.firestore.FieldValue.delete(),
                    panX: firebase.firestore.FieldValue.delete(),
                    panY: firebase.firestore.FieldValue.delete()
                }, { merge: true });
            } catch(err) { console.error('Firestore error:', err); }
        }

        // SUBIR A LA NUBE: Solo este botón crea tableros en Firestore
        document.getElementById('btnSyncCloud').addEventListener('click', async () => {
            if (!db) { showNotification('Firebase no configurado', 'error'); return; }
            const board = state.boards.find(b => b.id === state.activeBoardId);
            if (!board) return;
            if (board.isCloud) { showNotification('Ya está en la nube ☁️'); saveBoardToCloud(board.id); return; }

            const cloudId = `board_${Date.now()}`;
            board.isCloud = true; board.cloudId = cloudId;
            await saveBoardToCloud(board.id);

            const tabEl = document.querySelector(`.tab-btn[data-board-id="${board.id}"]`);
            if (tabEl) { tabEl.remove(); createTab(board.id); }
            subscribeActiveBoard(board);
            // Ahora que es nube, se remueve de localStorage al siguiente saveToLocal()
            saveToLocal();
            showNotification('Subido a la nube ☁️');
        });

        // Cargar tableros de la nube SOLO al iniciar (una vez)
        async function loadCloudBoards() {
            if (!db) return;
            try {
                const snapshot = await db.collection('boards').orderBy('updatedAt', 'desc').get();
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const exists = state.boards.find(b => b.cloudId === doc.id);
                    if (!exists) {
                        const id = `cloud_${doc.id}`;
                        state.boards.push(normalizeBoard({
                            id, name: data.name || 'Tablero nube',
                            imageData: data.imageData, objects: data.objects || [],
                            isCloud: true, cloudId: doc.id
                        }));
                        state.history[id] = []; state.historyIndex[id] = -1;
                        createTab(id);
                        if (state.activeBoardId === id) subscribeActiveBoard(state.boards.find(b=>b.id===id));
                    }
                });
            } catch(err) { console.warn('Error cargando nube:', err); }
        }

        // ===== TECLADO =====
        document.addEventListener('keydown', e => {
            if(textOverlay.style.display==='block') return;
            if(e.code==='Space'){state.spacePressed=true;canvas.style.cursor='grab';e.preventDefault();}
            if(e.ctrlKey||e.metaKey){if(e.key.toLowerCase()==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();} if(e.key.toLowerCase()==='y'){e.preventDefault();redo();} return;}
            if(e.key==='Delete'||e.key==='Backspace'){if(state.selectedObject) deleteSelectedObject(); return;}
            if(e.key==='Enter'&&state.selectedObject?.type==='text'){e.preventDefault();editSelectedText();return;}
            const map={b:'btnDraw',e:'btnEraser',t:'btnText',l:'btnLine',r:'btnRect',c:'btnCircle',v:'btnSelect'}; if(map[e.key.toLowerCase()]) document.getElementById(map[e.key.toLowerCase()]).click();
        });
        document.addEventListener('keyup', e => { if(e.code==='Space'){state.spacePressed=false;updateCursorStyle();} });

        tabAdd.addEventListener('click', () => createBoard());

        // ===== MODAL =====
        let modalCallback = null;
        function showModal(title, message, style, onConfirm) {
            if (typeof style === 'function') { onConfirm = style; style = 'danger'; }
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            modalCallback = onConfirm;
            modalConfirm.className = `modal-btn ${style || 'primary'}`;
            modalConfirm.textContent = style === 'danger' ? 'Eliminar' : 'Confirmar';
            modalOverlay.classList.add('show');
        }
        function closeModal() { modalOverlay.classList.remove('show'); modalCallback = null; }
        modalCancel.addEventListener('click', closeModal);
        modalConfirm.addEventListener('click', async () => {
            if (!modalCallback) { closeModal(); return; }
            modalConfirm.disabled = true;
            try {
                await modalCallback();
                closeModal();
            } catch (err) {
                console.error('Modal action error:', err);
                showNotification('No se pudo completar la acción', 'error');
            } finally {
                modalConfirm.disabled = false;
            }
        });
        modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

        function showNotification(m,type='success'){notification.textContent=m;notification.className='notification'+(type==='error'?' error':'');notification.classList.add('show');setTimeout(()=>notification.classList.remove('show'),2000);}

        // LOCALSTORAGE: Solo guarda tableros LOCALES (no cloud)
        function saveToLocal() {
            const localBoards = state.boards.filter(b => !b.isCloud).map(b => normalizeBoard(b));
            localStorage.setItem('glassboard_local_boards', JSON.stringify(localBoards));
            // Guardar el ID del tablero activo solo si es local
            const active = state.boards.find(b => b.id === state.activeBoardId);
            if (active && !active.isCloud) {
                localStorage.setItem('glassboard_active', state.activeBoardId);
            } else {
                // Si el activo es nube, guardar null para localStorage
                localStorage.setItem('glassboard_active', state.boards.filter(b=>!b.isCloud)[0]?.id || '');
            }
            localStorage.setItem('glassboard_counter', state.boardIdCounter);
        }

        function loadFromStorage() {
            const sB = localStorage.getItem('glassboard_local_boards');
            const sA = localStorage.getItem('glassboard_active');
            const sC = localStorage.getItem('glassboard_counter');
            let loaded = false;

            if (sB) {
                try {
                    const s = JSON.parse(sB);
                    if (Array.isArray(s) && s.length > 0) {
                        state.boards = []; state.boardIdCounter = parseInt(sC) || 0;
                        state.history = {}; state.historyIndex = {};
                        s.forEach(d => {
                            // Asegurar que no tenga isCloud=true
                            d.isCloud = false; d.cloudId = null;
                            state.boards.push(normalizeBoard(d));
                            state.history[d.id] = []; state.historyIndex[d.id] = -1;
                            createTab(d.id);
                        });
                        const targetId = sA && state.boards.find(x => x.id === sA) ? sA : state.boards[0].id;
                        switchBoard(targetId);
                        loaded = true;
                    }
                } catch(e) {}
            }
            if (!loaded) createBoard('Tablero 1');
            setTimeout(() => { saveCurrentBoard(); saveState(); }, 200);
            // Cargar nubes DESPUÉS de locales
            setTimeout(loadCloudBoards, 600);
        }

        loadFromStorage();
        window.addEventListener('beforeunload', () => { saveCurrentBoard(); saveToLocal(); if(state.activeBoardId) saveBoardToCloud(state.activeBoardId); });
    })();
    </script>
</body>
</html>
