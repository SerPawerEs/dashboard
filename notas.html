<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas</title>
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div id="search-bar">
        <input type="text" placeholder="Search" id="buscador" maxlength="50" autocomplete="off">
        <div id="borrar">X</div>
    </div>
    <div id="lupa">🔍</div>
    <div id="notas">➕</div>
    <div id="salir">🔙</div>
    <div id="addnote">
        <div style="font-size: 20px; font-family: 'Courier New', Courier, monospace; color: white; padding: 10px;" onclick="Alternar(addnote)">Nueva nota - X</div>
        <form style="display: flex; flex-direction: column; width: 90%;" onsubmit="event.preventDefault();subir()">
            <input style="border-radius: 20px; padding: 10px; margin: 5px;" type="text" placeholder="Titulo" id="txttitulo" required autocomplete="off">
            <textarea style="border-radius: 20px; padding: 10px; margin: 5px; height: 30vh;" placeholder="Nota" id="txttext" required spellcheck="false"></textarea>
            <button style="border-radius: 20px; padding: 10px; margin: 5px;" type="submit" onclick="Alternar(addnote)">Guardar</button>
        </form>
    </div>
    <div id="editnote">
        <div style="font-size: 20px; font-family: 'Courier New', Courier, monospace; color: white; padding: 10px;" onclick="Alternar(editdiv)">Editar nota - X</div>
        <form style="display: flex; flex-direction: column; width: 90%;" onsubmit="event.preventDefault();seditar()">
            <input style="border-radius: 20px; padding: 10px; margin: 5px;" type="text" placeholder="Titulo" id="edittitulo" required autocomplete="off">
            <textarea style="border-radius: 20px; padding: 10px; margin: 5px; height: 30vh;" placeholder="Nota" id="edittext" required spellcheck="false"></textarea>
            <button style="border-radius: 20px; padding: 10px; margin: 5px;" type="submit" onclick="Alternar(editdiv)">Guardar</button>
        </form>
    </div>
    <div class="note-container" id="note-container">
        <div class="content-note">Cargando...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="static/notas.js"></script>
</body>
</html>
